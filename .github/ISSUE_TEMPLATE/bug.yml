name: Bug Report
description: Something is broken on the portfolio site
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What's wrong?
      placeholder: Describe the issue
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen instead?
      placeholder: Describe the expected behavior
  - type: dropdown
    id: section
    attributes:
      label: Which section?
      options:
        - Hero
        - About
        - Certifications
        - Projects
        - Experience
        - Contact
        - Footer
        - Nav
        - Theme Toggle
        - Other
